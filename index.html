<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- Kept in step with sw.js by tools/bundle.js, and shown in the app so
         anyone can tell which copy of it they are looking at. -->
    <meta name="app-version" content="v10" />
    <meta name="app-build" content="8f2020e7" />
    <!-- viewport-fit=cover : sans lui, iOS ne remplit jamais env(safe-area-inset-*),
         et la barre du bas colle contre la zone de la barre d'accueil au lieu de
         s'arrêter au-dessus. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Compteur de points, listes et sondages partagés, pour la famille et les amis." />
    <title>Together</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23b8761a'/><circle cx='25' cy='32' r='12.5' fill='none' stroke='%23fdf6ea' stroke-width='4.2'/><circle cx='39' cy='32' r='12.5' fill='none' stroke='%23fdf6ea' stroke-width='4.2'/></svg>" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#b8761a" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-bar">
      <a class="app-bar__brand" href="#/">
        <span class="app-bar__logo" aria-hidden="true">
          <svg viewBox="11 18 42 28" width="36" height="24">
            <circle cx="25" cy="32" r="12.5" fill="none" stroke="currentColor" stroke-width="4.2" />
            <circle cx="39" cy="32" r="12.5" fill="none" stroke="currentColor" stroke-width="4.2" />
          </svg>
        </span>
        <span>
          <strong data-i18n="app.title">Together</strong>
          <small data-i18n="app.tagline"></small>
        </span>
      </a>
      <div class="app-bar__actions">
        <button type="button" class="icon-button" id="sync" data-i18n-title="sync.title" hidden>
          <span aria-hidden="true">⟳</span>
        </button>
        <button type="button" class="icon-button" id="theme-toggle" data-i18n-title="theme.toggle">
          <span aria-hidden="true">◐</span>
        </button>
        <button type="button" class="icon-button icon-button--text" id="lang-toggle" data-i18n="lang.switch"></button>
      </div>
    </header>

    <!-- At the bottom, within the thumb's reach, and always there: a phone is
         held from below. The tabs answer questions rather than sort by kind:
         what is on (home), when (agenda), with whom (groups), and the app's
         own settings. The "+" in the middle makes anything, from anywhere. -->
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a class="tab" href="#/" data-tab="home">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>
        <span data-i18n="tab.home">Accueil</span>
      </a>
      <a class="tab" href="#/agenda" data-tab="agenda">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>
        <span data-i18n="tab.agenda">Agenda</span>
      </a>
      <button type="button" class="tabs__new" id="create" data-i18n-title="create.title">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <a class="tab" href="#/groups" data-tab="groups">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c.6-3.3 3-5.2 6-5.2s5.4 1.9 6 5.2"/><path d="M15.5 5.6a3.2 3.2 0 0 1 0 6M17.5 14.6c1.8.7 3 2.3 3.4 4.9"/></svg>
        <span data-i18n="tab.groups">Groupes</span>
      </a>
      <a class="tab" href="#/settings" data-tab="settings">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></svg>
        <span data-i18n="tab.settings">Réglages</span>
      </a>
    </nav>

    <main id="view" class="view" aria-live="polite"></main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
