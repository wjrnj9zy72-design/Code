# Publie l'app sur GitHub Pages à chaque envoi sur main.
# Les tests passent d'abord : une version cassée ne part pas en ligne.
name: Publier l'app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Reconstruit les fichiers de dist/ à partir des sources. Sans cela,
      # modifier src/config.js depuis GitHub laisserait dist/ en retard, et le
      # test de fraîcheur ferait échouer la publication.
      - name: Reconstruire les fichiers livrés
        run: npm run bundle

      - name: Tests
        run: npm test

      - name: Rassembler le site
        run: |
          mkdir -p site
          cp index.html styles.css manifest.webmanifest sw.js site/
          cp -r src icons dist site/

      # enablement active Pages si ce n'est pas déjà fait, au lieu d'échouer.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
