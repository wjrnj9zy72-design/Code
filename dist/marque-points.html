    <style>
/* ---------------------------------------------------------------- tokens --- */
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --surface-alt: #f0ece3;
  --border: #ded7c9;
  --text: #241f18;
  --muted: #6d6458;
  --accent: #b8761a;
  --accent-text: #ffffff;
  --accent-soft: #fbf0dc;
  --good: #2f7d4f;
  --bad: #b2372c;
  --shadow: 0 1px 2px rgb(36 31 24 / 8%), 0 8px 24px rgb(36 31 24 / 6%);
  --radius: 14px;
  --radius-sm: 9px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #17150f;
    --surface: #211e17;
    --surface-alt: #2b2720;

    --muted: #a49a89;
    --accent: #e0a33f;
    --accent-text: #201a10;
    --accent-soft: #332b1c;
    --good: #66bd86;
    --bad: #e4796b;
    --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 8px 24px rgb(0 0 0 / 30%);
    color-scheme: dark;
  }
}

:root[data-theme='dark'] {
  --bg: #17150f;
  --surface: #211e17;
  --surface-alt: #2b2720;
  --border: #3b362c;
  --text: #f2ede2;
  --muted: #a49a89;
  --accent: #e0a33f;
  --accent-text: #201a10;
  --accent-soft: #332b1c;
  --good: #66bd86;
  --bad: #e4796b;
  --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 8px 24px rgb(0 0 0 / 30%);
  color-scheme: dark;
}

/* ------------------------------------------------------------------ base --- */
* { box-sizing: border-box; }

[hidden] { display: none !important; }

html, body { min-height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3 { line-height: 1.2; margin: 0; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0; }

a { color: inherit; }

:where(button, input, select, textarea):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* --------------------------------------------------------------- app bar --- */
.app-bar {
  position: sticky;
  /* Clears the status bar when the page runs edge to edge on a phone;
     env() falls back to 0px everywhere else. */
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 16px;
  /* The plain colour first: a Safari without color-mix() would otherwise
     leave this sticky bar transparent over the scrolling page. */
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}

.app-bar__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  min-width: 0;
}

.app-bar__brand strong { display: block; font-size: 1.05rem; }
.app-bar__brand small { display: block; color: var(--muted); font-size: 0.75rem; }
/* The mark: two tokens side by side, in the accent, at the size of a word. */
.app-bar__logo { display: flex; flex: none; color: var(--accent); }
.app-bar__actions { display: flex; gap: 6px; flex: none; }

.icon-button {
  min-width: 40px;
  height: 40px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text);
  font-size: 0.85rem;
  cursor: pointer;
}

.icon-button:hover { background: var(--surface-alt); }

/* ----------------------------------------------------------------- views --- */
.view {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px 16px 64px;
  display: grid;
  gap: 20px;
}

.section { display: grid; gap: 12px; }

.section__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
}

.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row--tight { gap: 6px; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
.center { text-align: center; }

/* --------------------------------------------------------------- buttons --- */
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-weight: 550;
  cursor: pointer;
}

.button:hover { background: var(--surface-alt); }

.button--primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
}

.button--primary:hover {
  background: var(--accent);
  filter: brightness(1.06);
}
.button--danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); }
.button--ghost { background: transparent; border-color: transparent; }
.button--block { width: 100%; }
.button--small { min-height: 36px; padding: 0 12px; font-size: 0.85rem; }

/* ---------------------------------------------------------------- inputs --- */
label { display: grid; gap: 6px; font-size: 0.85rem; font-weight: 550; }

input[type='text'],
input[type='number'],
input[type='date'],
input[type='time'],
select,
textarea {
  width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font: inherit;
}

textarea { min-height: 66px; resize: vertical; }

/* A date field asks for as much width as its own calendar button and text
   take, whatever its box says: on an iPhone it then spills out of a narrow
   column. Drawn plainly, it keeps to the width it is given. */
input[type='date'],
input[type='time'] {
  display: block;
  min-width: 0;
  max-width: 100%;
  -webkit-appearance: none;
  appearance: none;
}

input[type='date']::-webkit-date-and-time-value,
input[type='time']::-webkit-date-and-time-value { text-align: left; }

.checkbox {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 550;
  font-size: 0.9rem;
}

.checkbox input { width: 20px; height: 20px; min-height: 0; accent-color: var(--accent); }

/*
 * A row one chooses in a list: a radio or a checkbox beside a label that may
 * wrap onto two lines, so the control stays level with the first of them.
 */
.choice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 0.9rem;
  line-height: 1.35;
}

.choice input {
  flex: none;
  width: 20px;
  height: 20px;
  min-height: 0;
  margin-top: 1px;
  accent-color: var(--accent);
}

.stack--tight { gap: 8px; }

/* A way in that most people never need, folded away until they do. */
.details { font-size: 0.9rem; }
.details summary { padding: 6px 0; color: var(--muted); cursor: pointer; }
.details .row { margin-top: 6px; }

/* The code field beside the group's name: narrow enough to sit next to it. */
#group-code { max-width: 7.5em; }

/* A long list of games scrolls, rather than pushing the buttons off-screen. */
#share-pick { max-height: 38vh; overflow-y: auto; }

/* A choice this copy of the app cannot offer yet, and says why underneath. */
.choice--off { opacity: 0.55; }

/* The six-digit code that guards a shared lot: made to be read out loud. */
.code-box {
  display: grid;
  gap: 2px;
  padding: 12px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  text-align: center;
}

.code-box__label { font-size: 0.8rem; font-weight: 550; }

.code-box__value {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 1.8rem;
  letter-spacing: 0.18em;
}

.code-input {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 1.5rem;
  letter-spacing: 0.18em;
  text-align: center;
}

/* Une marche après l'autre : l'ordre compte, donc il se voit. */
.steps {
  margin: 0;
  padding-left: 1.4em;
  display: grid;
  gap: 4px;
}

/* Le même code, mais à lire et à recopier plutôt qu'à saisir. */
.code-shown {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 1.1rem;
  letter-spacing: 0.14em;
  font-weight: 650;
}

/* One remembered share, or one group: what it is on one side, what to do with
   it on the other. */
.lot, .group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

/* One person knocking, or one device already in: who on one side, what to do
   about them on the other. Inside a group's row, so it steps in a little. */
.knock {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}

.knock strong {
  display: block;
}

/* A group now holds its own blocks, so it stacks instead of sitting on a line. */
.group {
  flex-direction: column;
  align-items: stretch;
}

.group > .row {
  justify-content: flex-start;
}

.lot__code {
  margin-right: 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 1.05rem;
  letter-spacing: 0.12em;
}

/* The fetch button, while it is fetching. */
.icon-button--busy {
  animation: turning 1s linear infinite;
}

@keyframes turning {
  to {
    transform: rotate(360deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .icon-button--busy {
    animation: none;
    opacity: 0.6;
  }
}

.field-grid {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
}

.hint { color: var(--muted); font-size: 0.78rem; font-weight: 400; }

/* ------------------------------------------------------------ game cards --- */
.game-list { display: grid; gap: 10px; }

.game-card {
  display: grid;
  gap: 4px;
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  color: inherit;
  font: inherit;
  cursor: pointer;
}

.game-card:hover { border-color: var(--accent); }
.game-card__title { display: flex; align-items: center; gap: 8px; font-weight: 650; }
.game-card__meta { color: var(--muted); font-size: 0.82rem; }
/* The event a card belongs to: the thread that ties it to the rest. */
.game-card__event { color: var(--accent); font-weight: 600; }
.event-when { margin: 2px 0 0; }

.pill {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 0.72rem;
  font-weight: 650;
  letter-spacing: 0.02em;
}

.pill--done { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill--late { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }

/* ------------------------------------------------------------- dashboard --- */
/*
 * The numbers a group or a person is summed up by: wide enough to read at a
 * glance, and — under a group — tappable, since a number is also a way in.
 */
.tiles {
  display: grid;
  /* 56px au minimum : à cinq cases sur un écran de 320, elles passent à la
     ligne plutôt que de rogner « Sondages » au milieu d'un mot. */
  grid-template-columns: repeat(auto-fit, minmax(56px, 1fr));
  gap: 8px;
}

.tile {
  padding: 8px 2px;
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--surface-alt);
  color: inherit;
  font: inherit;
  text-align: center;
}

button.tile { cursor: pointer; }
button.tile:hover { background: var(--accent-soft); }

.tile__value { display: block; font-size: 1.3rem; font-weight: 700; line-height: 1.15; }
.tile__label { display: block; color: var(--muted); font-size: 0.68rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* One line of someone's file: what it is on the left, where it stands on the right. */
.entries { display: flex; flex-direction: column; }

.entry {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  padding: 11px 0;
  border: 0;
  border-top: 1px solid var(--border);
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.entry:first-child { border-top: 0; }

/* One transfer of "who pays whom", with the button that notes it as done. */
.move { display: grid; gap: 4px; padding-bottom: 12px; border-top: 1px solid var(--border); }
.move:first-child { border-top: 0; }
.move .entry { border-top: 0; }
.move .button { width: 100%; }
.entry__what { min-width: 0; overflow-wrap: anywhere; }
.entry__value { flex: none; color: var(--muted); font-size: 0.85rem; }
.entry__value--good { color: var(--good); font-weight: 600; }
.entry__value--bad { color: var(--bad); font-weight: 600; }

/* A person's name, with the initial the overview lists them under. */
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }

.who__mark {
  display: flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 1.15rem;
  font-weight: 700;
}

/* ------------------------------------------------------------- standings --- */
.standings { display: grid; gap: 8px; }

.standing {
  display: grid;
  grid-template-columns: 2rem 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: var(--surface-alt);
}

.standing--leader { background: var(--accent-soft); }
.standing__rank { font-weight: 700; color: var(--muted); text-align: center; }
.standing--leader .standing__rank { color: var(--accent); }
.standing__name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.standing__total { font-variant-numeric: tabular-nums; font-size: 1.1rem; font-weight: 700; }
.standing__gap { color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; }

/* ----------------------------------------------------------------- table --- */
.table-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }

table.scores {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
  font-size: 0.9rem;
}

table.scores th,
table.scores td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  text-align: right;
  white-space: nowrap;
}

table.scores th:first-child,
table.scores td:first-child {
  text-align: left;
  position: sticky;
  left: 0;
  background: var(--surface);
}

table.scores thead th { color: var(--muted); font-size: 0.78rem; font-weight: 650; }
table.scores tbody tr:hover td { background: var(--surface-alt); }
table.scores tbody tr:hover td:first-child { background: var(--surface-alt); }
table.scores tfoot td { font-weight: 700; border-bottom: none; }
table.scores .round-edit { cursor: pointer; }
table.scores .meta-cell { color: var(--muted); }

/* ------------------------------------------------------------ round form --- */
.score-rows { display: grid; gap: 8px; }

.score-row {
  display: grid;
  grid-template-columns: 1fr 104px;
  align-items: center;
  gap: 10px;
}

.score-row__name { font-weight: 600; overflow-wrap: anywhere; }
.score-row input { text-align: right; font-variant-numeric: tabular-nums; }
/* A name is read from the left, like every other name field in the app. */
.score-row input[data-name-index] { text-align: left; font-variant-numeric: normal; }

.sum-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.85rem;
  font-weight: 600;
}

.sum-line--ok { color: var(--good); }
.sum-line--off { color: var(--bad); }

.banner {
  display: grid;
  gap: 4px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface-alt);
  font-size: 0.88rem;
}

.banner--win {
  border-color: color-mix(in srgb, var(--good) 45%, var(--border));
  background: color-mix(in srgb, var(--good) 12%, transparent);
}

.banner--warn {
  border-color: color-mix(in srgb, var(--bad) 45%, var(--border));
  background: color-mix(in srgb, var(--bad) 10%, transparent);
}

.banner ul { margin: 0; padding-left: 18px; }

.notes { color: var(--muted); font-size: 0.82rem; }

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (max-width: 420px) {
  .app-bar__brand small { display: none; }
  .score-row { grid-template-columns: 1fr 88px; }
}

/* ----------------------------------------------------------------- lines --- */
/*
 * A line in a list: a box to tick, the text, and who it is for. The three are
 * separate targets — ticking is the common one, so it gets the widest.
 */
.lines {
  display: grid;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.line {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 4px 10px 4px 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}

.line__tick {
  display: flex;
  align-items: center;
  padding: 10px;
  cursor: pointer;
}

.line__tick input {
  width: 22px;
  height: 22px;
  min-height: 0;
  accent-color: var(--accent);
}

.line__text {
  padding: 10px 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.line__who {
  /* Assez haute pour un doigt : elle se tapote autant que la ligne elle-même. */
  min-height: 34px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: none;
  color: var(--text);
  font: inherit;
  font-size: 0.8rem;
  white-space: nowrap;
  cursor: pointer;
}

.line__who--nobody { color: var(--muted); border-style: dashed; }

.line--done .line__text { color: var(--muted); text-decoration: line-through; }

/* The day a line is for, under the words it belongs to. */
.line__due { display: block; color: var(--muted); font-size: 0.75rem; }
.line--repay .line__text > span:first-child { color: var(--muted); font-style: italic; }
.line--repay .line__amount { color: var(--muted); font-weight: 500; }
.line__due--late { color: var(--bad); font-weight: 600; }
.line--done .line__due { color: var(--muted); font-weight: 400; }

/* What has gone past its day, wherever it is counted. */
.late { color: var(--bad); font-weight: 600; }

/*
 * Le montant et le payeur sur une même ligne : le montant garde de quoi écrire
 * « 1 234,50 », le nom prend le reste et se tronque plutôt que de l'écraser.
 */
/* La rangée « date retenue » : elle passe à la ligne plutôt que de déborder. */
#poll-day { flex: 1 1 9em; min-width: 8em; }
#poll-hour { flex: 0 1 6em; min-width: 5em; }
/* Le nom qui partira dans l'agenda : il prend toute la largeur qui reste. */
#poll-title { flex: 1 1 10em; min-width: 0; }

#spend-amount { flex: 0 1 7.5em; min-width: 5.5em; }
#spend-by { flex: 1 1 6em; min-width: 0; }

/* Ce qu'une dépense a coûté, au bout de sa ligne : aligné, et lisible d'un coup. */
.line__amount {
  padding-right: 4px;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  white-space: nowrap;
}

.chip {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: none;
  color: var(--text);
  font: inherit;
  font-size: 0.85rem;
  cursor: pointer;
}

.chip--on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

.row--tight { flex-wrap: nowrap; gap: 8px; }
.row--tight input { flex: 1; }

/* ------------------------------------------------------------- segmented --- */
/*
 * Two or three ways to look at the same thing (an account's expenses versus
 * its balances), switched in place rather than by leaving the page: a pill
 * inside a pill, the way iOS and most banking apps do it.
 */
.segmented {
  display: grid;
  grid-auto-flow: column;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  background: var(--surface-alt);
}

.segmented__option {
  padding: 10px 4px;
  border: none;
  border-radius: 999px;
  background: none;
  color: var(--muted);
  font: inherit;
  font-weight: 650;
  font-size: 0.9rem;
  cursor: pointer;
}

/* The home page's kinds: six words on a phone's width, so each takes only
   the room its word needs, and the row may scroll rather than wrap. */
.segmented--kinds {
  grid-auto-columns: auto;
  overflow-x: auto;
  scrollbar-width: none;
}

.segmented--kinds .segmented__option {
  padding: 8px 2px;
  font-size: 0.74rem;
  white-space: nowrap;
}

@media (max-width: 340px) {
  .segmented--kinds .segmented__option { padding: 8px 1px; font-size: 0.64rem; }
}

.segmented__option[aria-current="true"] {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.16);
}

/* --------------------------------------------------------------- pill form -- */
/*
 * A softer, borderless take on the usual boxed input: filled with the page's
 * own alt surface instead of outlined, fully rounded. Used where a form is
 * the whole point of the screen (adding an expense) rather than one control
 * among many.
 */
.field-pill,
input.field-pill,
select.field-pill {
  width: 100%;
  min-height: 48px;
  padding: 10px 16px;
  border: none;
  border-radius: 999px;
  background: var(--surface-alt);
  color: var(--text);
  font: inherit;
}

.field-pill--amount {
  display: flex;
  align-items: center;
  gap: 6px;
}

.field-pill--amount input {
  flex: 1;
  min-width: 0;
  border: none;
  background: none;
  padding: 0;
  font: inherit;
  color: inherit;
}

.field-pill--amount input:focus { outline: none; }

.field-pill__suffix { color: var(--muted); font-weight: 600; }

.field-pill--submit { border-radius: 999px; }

.field-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.field-row > label { min-width: 0; }

/* Who a new expense is split between: a plain checklist, ticked by default —
   unticking someone is the exception, so it is the only thing to notice. */
.split-list {
  display: grid;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface-alt);
}

.split-list__head {
  display: grid;
  gap: 2px;
  padding: 10px 14px;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--muted);
}

.split-list__head .muted { font-weight: 550; }

.split-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--surface);
  font-weight: 550;
}

.split-row:not(:last-child) { border-bottom: 1px solid var(--border); }
.split-row input[type='checkbox'] { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent); }

/* The balances tab once nothing is left to settle: a plain state deserves a
   plain, good-news answer rather than an empty section. */
.settled-banner {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  border-radius: var(--radius);
  background: var(--surface-alt);
}

.settled-banner__icon { flex: none; font-size: 1.7rem; }
.settled-banner__title { font-size: 1.05rem; }

/* ----------------------------------------------------------------- votes --- */
/*
 * The poll grid: choices down the side, people across. Cells are square and
 * finger-sized, because tapping them is the whole interaction.
 */
.votes { width: 100%; border-collapse: collapse; font-size: 0.9rem; }

.votes th, .votes td { padding: 4px; text-align: center; }

.votes thead th {
  padding-bottom: 8px;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 600;
}

.votes tbody th {
  text-align: left;
  font-weight: 550;
}

.votes tbody tr { border-top: 1px solid var(--border); }

.votes__leader { background: var(--accent-soft); }

/*
 * With a dozen people across, the grid scrolls sideways — and without this the
 * choices scroll away with it, leaving a column of ✓ with no evening beside
 * them. The first column stays; it needs a background of its own to hide what
 * slides underneath, the leader's tint included.
 */
.votes tbody th,
.votes thead th:first-child {
  position: sticky;
  left: 0;
  z-index: 1;
  background: var(--bg);
  /* Wide enough to read an evening, narrow enough to leave room for the grid.
     Words wrap whole: "anywhere" would let the table squeeze the column down
     to one letter a line. */
  min-width: 5.5em;
  max-width: 9em;
  overflow-wrap: break-word;
}

.votes tbody tr.votes__leader th { background: var(--accent-soft); }

/* The box that scrolls has a few pixels of padding on its left, and what slid
   under the sticky column showed through them. Flush on that side, there is
   nothing left to show through. */
.table-wrap--flush { margin-left: 0; padding-left: 0; }

.votes__mine { background: color-mix(in srgb, var(--accent) 8%, transparent); }

.votes__score { font-variant-numeric: tabular-nums; font-weight: 650; }

.vote {
  width: 38px;
  height: 38px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: var(--muted);
  font: inherit;
  font-size: 1rem;
  cursor: pointer;
}

.vote--yes { border-color: #2f7d4f; background: #e7f3ec; color: #1e5c39; }
.vote[disabled] { cursor: default; opacity: 0.75; }
/* The others' cells, while this device answers for someone: still readable,
   plainly not for touching. */
.vote--other { opacity: 0.45; border-style: dashed; }
.vote--other.vote--yes { opacity: 0.6; border-style: solid; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .vote--yes { border-color: #4a9a6a; background: #17301f; color: #8fd3a8; }
}

:root[data-theme="dark"] .vote--yes { border-color: #4a9a6a; background: #17301f; color: #8fd3a8; }

/* ------------------------------------------------------------------ solo --- */
/*
 * A shared poll opened from its link: the poll and nothing else. No tabs, no
 * sync button, and the name at the top is no longer a way home.
 */
body.solo .tabs,
body.solo #sync { display: none; }
body.solo .app-bar__brand { cursor: default; }

/* « Proposé par … », sous un titre : qui demande, en un coup d'œil. */
.signed { margin: 2px 0 0; color: var(--muted); font-style: italic; }

/* ----------------------------------------------------------------- gauge --- */
/*
 * The poll's answer at a glance: one bar per choice, the longest first. The
 * track is everyone asked, so a bar's length is a share of the people, not of
 * the winner. One colour for every bar — the leader is told apart by weight,
 * not by a second hue — and the number at the end, in text ink, says what the
 * length only suggests.
 */
.gauge { margin: 4px 0 16px; }
.gauge__title { font-size: 0.95rem; margin: 0 0 8px; }
.gauge__rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.gauge__row {
  display: grid;
  grid-template-columns: minmax(4.5em, 7.5em) 1fr auto;
  align-items: center;
  gap: 10px;
  font-size: 0.9rem;
}
.gauge__label { overflow-wrap: break-word; min-width: 0; }
.gauge__track {
  height: 12px;
  border-radius: 0 4px 4px 0;
  background: var(--surface-alt);
  overflow: hidden;
}
.gauge__fill {
  display: block;
  height: 100%;
  /* Anchored square on the baseline, rounded at the end the data reaches. */
  border-radius: 0 4px 4px 0;
  background: var(--accent);
  transition: width 0.25s ease;
}
.gauge__count {
  min-width: 3.2em;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}
.gauge__row--lead .gauge__label,
.gauge__row--lead .gauge__count { font-weight: 700; color: var(--text); }

@media (prefers-reduced-motion: reduce) {
  .gauge__fill { transition: none; }
}

/* ------------------------------------------------------------------ tabs --- */
/*
 * The parts of the app, along the bottom of the screen: within the thumb's
 * reach, and still there halfway down a long list. An icon over each word, so
 * the words can stay small on a narrow phone without the bar turning to
 * guesswork. The "+" sits astride the bar's top edge, exactly in the middle:
 * two tabs each side, and a column of its own between them.
 */
.tabs {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: grid;
  /* minmax(0, 1fr) et non 1fr : sans cela, chaque piste ne peut pas descendre
     sous la largeur de son mot, et les onglets poussent la barre — donc toute
     la page — sur un écran de 320. */
  grid-template-columns: repeat(2, minmax(0, 1fr)) 76px repeat(2, minmax(0, 1fr));
  align-items: stretch;
  border-top: 1px solid var(--border);
  background: var(--surface);
  /* The iPhone's home bar: the tabs sit above it, the colour runs under it. */
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* The bar covers the bottom of the page; the page makes room for it. */
body:not(.solo) .view {
  padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
}

.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 0 6px;
  min-width: 0;
  border-top: 2px solid transparent;
  margin-top: -1px;
  color: var(--muted);
  font-weight: 600;
  font-size: 0.72rem;
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
}

.tab > span {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tab__icon,
.tabs__new svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tab[aria-current="page"] {
  border-top-color: var(--accent);
  color: var(--accent);
}

.tabs__new {
  grid-column: 3;
  justify-self: center;
  align-self: start;
  /* Half above the bar, half on it. */
  margin-top: -28px;
  display: grid;
  place-items: center;
  width: 60px;
  height: 60px;
  padding: 0;
  /* A ring the colour of the page cuts the bar's edge around the button. */
  border: 4px solid var(--bg);
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-text);
  cursor: pointer;
  box-shadow: 0 3px 10px rgb(0 0 0 / 0.2);
}

.tabs__new svg { width: 28px; height: 28px; stroke-width: 2.4; }

/* The overview has no tab: the name at the top is its way in, and says so. */
.app-bar__brand[aria-current="page"] strong { color: var(--accent); }

@media (max-width: 345px) {
  .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)) 68px repeat(2, minmax(0, 1fr)); }
  .tab { font-size: 0.66rem; }
  .tabs__new { width: 54px; height: 54px; margin-top: -24px; }
}

/* The "+" menu: what can be made, one big button each. */
.create-menu { display: grid; gap: 8px; }
.create-menu .button { justify-content: flex-start; text-align: left; }

/* ---------------------------------------------------------------- dialog --- */
.dialog {
  width: min(560px, calc(100vw - 32px));
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
}

.dialog::backdrop { background: rgb(0 0 0 / 45%); }

.dialog textarea {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.78rem;
}

/* --------------------------------------------------------- card counter --- */
.score-row--counter { grid-template-columns: 1fr auto 96px; }

.counter-button {
  min-height: 40px;
  padding: 0 10px;
  font-size: 1.1rem;
  line-height: 1;
}

.counter-readout {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.counter-readout strong { font-size: 1.35rem; }

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
  gap: 8px;
}

.card-button {
  display: grid;
  place-items: center;
  gap: 1px;
  min-height: 56px;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 1.05rem;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}

.card-button:hover { border-color: var(--accent); }

.card-button--picked {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
}

.card-button small { font-size: 0.7rem; font-weight: 600; opacity: 0.85; }

.button:disabled { opacity: 0.45; cursor: not-allowed; }

.dialog--ask { width: min(420px, calc(100vw - 32px)); }

/* The warning text is built with line breaks, which must survive. */
.ask-message { white-space: pre-line; }

/* ------------------------------------------------------------ tarot deal --- */
.deal-result {
  display: grid;
  gap: 6px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface-alt);
  font-variant-numeric: tabular-nums;
}

.deal-result--won { border-color: color-mix(in srgb, var(--good) 45%, var(--border)); }
.deal-result--lost { border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); }

.deal-scores {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  font-size: 0.9rem;
}

.deal-scores b { font-weight: 600; }

/* -------------------------------------------------------------- qr code --- */
.qr {
  display: grid;
  place-items: center;
  padding: 12px;
  border-radius: var(--radius-sm);
  background: #fff; /* a code must stay black on white to be readable */
}

.qr svg { max-width: 100%; height: auto; }

/* A group's name on the overview: the door to its own page. */
.group-link {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  min-height: 44px;
  padding: 0;
  border: none;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.group-link span { white-space: nowrap; }

/* Sharing, under a document's title: the one action it is made for. */
.share-bar > .button { flex: 1 1 auto; }

/* A document's rare actions, folded away until asked for. */
.actions__more { margin-top: 10px; }
.actions__more > .row { margin-top: 8px; }

/* Picking a day for a poll's choices, under the box of choices. */
.add-day { max-width: 16em; }

/* The first opening: what the app is for, a name, and where to begin. */
.welcome h2 { margin: 0; }
.welcome .lead { margin: 0; }

/* ----------------------------------------------------------------- ideas --- */
:root {
  --ink-red: #c0392b;
  --ink-blue: #2463b8;
  --ink-green: #2f7d4f;
  --ink-orange: #d9790f;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --ink-red: #ef7b6c;
    --ink-blue: #7fb0f2;
    --ink-green: #6cc58e;
    --ink-orange: #f0a64b;
  }
}

:root[data-theme='dark'] {
  --ink-red: #ef7b6c;
  --ink-blue: #7fb0f2;
  --ink-green: #6cc58e;
  --ink-orange: #f0a64b;
}

.idea-add { margin: 4px 0 14px; }
.idea-add .button { flex: 1; }

.idea-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}

.idea-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 96px;
  min-width: 0;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.idea-card:hover { border-color: var(--accent); }

.idea-card__text {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 8;
  overflow: hidden;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 0.92rem;
}

.idea-card--sketch { padding: 6px; }
.idea-card__caption { padding: 0 6px 4px; font-size: 0.85rem; color: var(--muted); overflow-wrap: anywhere; }

.sketch { display: block; width: 100%; height: auto; }
.sketch path { fill: none; stroke-linecap: round; stroke-linejoin: round; }

.ink-ink { stroke: var(--text); background: var(--text); }
.ink-red { stroke: var(--ink-red); background: var(--ink-red); }
.ink-blue { stroke: var(--ink-blue); background: var(--ink-blue); }
.ink-green { stroke: var(--ink-green); background: var(--ink-green); }
.ink-orange { stroke: var(--ink-orange); background: var(--ink-orange); }

.dialog--note textarea {
  width: 100%;
  font: inherit;
  font-size: 1rem;
  resize: vertical;
}

.dialog--sketch { width: min(760px, calc(100vw - 16px)); padding: 14px; }

.sketch-pad {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  overflow: hidden;
}

.sketch-pad .sketch {
  touch-action: none;
  cursor: crosshair;
  user-select: none;
  -webkit-user-select: none;
}

.sketch-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.sketch-tools + .sketch-tools { margin-top: 6px; }
.sketch-tools__gap { width: 8px; }

.swatch {
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 2px solid var(--border);
  border-radius: 50%;
  cursor: pointer;
}

.swatch--pen { background: var(--surface); }
.swatch--pen span { display: block; border-radius: 50%; background: var(--text); }
.swatch--pen .swatch__rubber { background: transparent; border: 2px solid var(--text); }
.swatch--on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

/* A card or a line that slides left to uncover « Supprimer » (src/swipe.js). */
.swipe {
  position: relative;
  display: grid;
  min-width: 0;
  border-radius: var(--radius);
  overflow: hidden;
}

.swipe__body {
  display: grid;
  position: relative;
  touch-action: pan-y;
  background: var(--bg);
}

.swipe__body.line { background: var(--surface); }

.swipe__body > .game-card,
.swipe__body > .idea-card { box-shadow: none; }

.swipe__delete {
  position: absolute;
  inset: 0 0 0 auto;
  width: 96px;
  border: 0;
  border-radius: 0 var(--radius) var(--radius) 0;
  background: var(--bad);
  color: var(--surface);
  font: inherit;
  font-weight: 650;
  font-size: 0.85rem;
  cursor: pointer;
}

.idea-hint { margin: -6px 0 16px; }
    </style>

  <body>
    <header class="app-bar">

        <span class="app-bar__logo" aria-hidden="true">

            <circle cx="25" cy="32" r="12.5" fill="none" stroke="currentColor" stroke-width="4.2" />
            <circle cx="39" cy="32" r="12.5" fill="none" stroke="currentColor" stroke-width="4.2" />
          </svg>
        </span>
        <span>
          <strong data-i18n="app.title">Together</strong>
          <small data-i18n="app.tagline"></small>
        </span>
      </a>
      <div class="app-bar__actions">
        <button type="button" class="icon-button" id="sync" data-i18n-title="sync.title" hidden>
          <span aria-hidden="true">⟳</span>

      </div>
    </header>

    <!-- At the bottom, within the thumb's reach, and always there: a phone is

         what is on (home), when (agenda), with whom (groups), and the app's
         own settings. The "+" in the middle makes anything, from anywhere. -->
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a class="tab" href="#/" data-tab="home">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>
        <span data-i18n="tab.home">Accueil</span>
      </a>
      <a class="tab" href="#/agenda" data-tab="agenda">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>
        <span data-i18n="tab.agenda">Agenda</span>
      </a>
      <button type="button" class="tabs__new" id="create" data-i18n-title="create.title">

      </button>
      <a class="tab" href="#/groups" data-tab="groups">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c.6-3.3 3-5.2 6-5.2s5.4 1.9 6 5.2"/><path d="M15.5 5.6a3.2 3.2 0 0 1 0 6M17.5 14.6c1.8.7 3 2.3 3.4 4.9"/></svg>
        <span data-i18n="tab.groups">Groupes</span>
      </a>
      <a class="tab" href="#/settings" data-tab="settings">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></svg>
        <span data-i18n="tab.settings">Réglages</span>
      </a>
    </nav>

const LANGUAGES = Object.keys(STRINGS);

let current = 'fr';

function detectLanguage() {
  const candidates = typeof navigator === 'undefined' ? [] : navigator.languages || [navigator.language];
  for (const tag of candidates) {
    if (!tag) continue;
    const base = tag.toLowerCase().split('-')[0];
    if (LANGUAGES.includes(base)) return base;
  }
  return 'fr';
}

function setLanguage(lang) {
  current = LANGUAGES.includes(lang) ? lang : 'fr';
  return current;
}

function getLanguage() {
  return current;
}

function t(key, params = {}) {
  const template = STRINGS[current]?.[key] ?? STRINGS.fr[key] ?? key;
  return template
    .replace(/\{(\w+)\|([^|{}]*)\|([^|{}]*)\}/g, (match, name, one, many) =>
      Object.prototype.hasOwnProperty.call(params, name) ? (isOne(params[name]) ? one : many) : match,
    )
    .replace(/\{(\w+)\}/g, (match, name) =>
      Object.prototype.hasOwnProperty.call(params, name) ? String(params[name]) : match,
    );
}

/**
 * Whether a count takes the singular: « 0 ligne, 1 ligne, 2 lignes » in
 * French, "0 lines, 1 line, 2 lines" in English.
 */
function isOne(count) {
  const n = Math.abs(Number(count));
  return current === 'en' ? n === 1 : n < 2;
}

/**
 * Game presets.
 *
 * Every game is described with the same handful of knobs so the scoring engine
 * stays generic. Adding a game means adding an entry here — no UI changes.
 *
 *   direction   'low'  lowest total wins (penalty games: Papayoo, Hearts…)
 *               'high' highest total wins (Belote, Uno…)
 *   endMode     'threshold' the game ends as soon as someone reaches `target`
 *               'rounds'    the game ends after a fixed number of rounds
 *               'manual'    it ends when the players say so
 *   roundSum    expected sum of a round's scores, or null when it is free.
 *               Checked as a warning only: most games have variants that break it.
 *   entrantLabel what we are scoring: 'player' or 'team'.
 *   meta        one optional per-round field (e.g. which suit was the Papayoo).
 *   helper      an optional card counter for the round form; see src/helpers.js.
 *   group       how the game is filed in the picker: cards, tiles, dice,
 *               outdoor, other.
 *   labelKey    for a preset whose name is a category rather than a game, the
 *               translation key to show instead of `name`.
 *   calculator  a dedicated entry screen instead of plain score boxes.
 */

function presetConfig(preset) {

    roundSum: preset.roundSum,

}

 * the browser offers it (it needs a secure context), with a weaker but still
 * random fallback elsewhere.
 *
 * Exported because a set of games shared together is named the same way, and
 * for the same reason.
 */
function uid(prefix = 'id') {
  const uuid = globalThis.crypto?.randomUUID?.();
  if (uuid) return `${prefix}_${uuid}`;
  const random = () => Math.random().toString(36).slice(2, 10);
  return `${prefix}_${Date.now().toString(36)}_${random()}${random()}`;
}

/**
 * Build a new game.
 * `names` is a list of player (or team) names, `overrides` patches the config.
 */
function createGame({ presetId, names, overrides = {}, name = '', shared = false, groupId = null }) {
  const preset = getPreset(presetId);
  if (!preset) throw new Error(`Unknown preset: ${presetId}`);

  const players = names
    .map((raw, index) => (raw || '').trim() || `#${index + 1}`)
    .map((playerName) => ({ id: uid('p'), name: playerName }));

  const now = Date.now();
  return {
    id: uid('g'),
    presetId,
    name: name.trim(),
    createdAt: now,
    updatedAt: now,
    finishedAt: null,
    // A game is only sent to the shared database once it is shared — either
    // deliberately, or because this device sends everything by choice. The
    // group it was shared in says whose key may change or remove it later.
    shared: Boolean(shared),
    groupId: groupId || null,
    archivedAt: null,
    players,
    config: { ...presetConfig(preset), ...overrides },
    rounds: [],
  };
}

/** Normalise a { playerId: value } map into finite numbers, dropping blanks to 0. */
function normaliseScores(game, scores) {
  const clean = {};
  for (const player of game.players) {
    const value = scores?.[player.id];
    clean[player.id] = Number.isFinite(value) ? value : 0;
  }
  return clean;
}

function addRound(game, { scores, meta = null, note = '' }) {
  const round = {
    id: uid('r'),
    scores: normaliseScores(game, scores),
    meta,
    note,
  };
  return { ...game, rounds: [...game.rounds, round], updatedAt: Date.now() };
}

function updateRound(game, roundId, { scores, meta, note }) {
  const rounds = game.rounds.map((round) => {
    if (round.id !== roundId) return round;
    return {
      ...round,
      scores: scores ? normaliseScores(game, scores) : round.scores,
      meta: meta === undefined ? round.meta : meta,
      note: note === undefined ? round.note : note,
    };
  });
  return { ...game, rounds, updatedAt: Date.now() };
}

function removeRound(game, roundId) {
  return {
    ...game,
    rounds: game.rounds.filter((round) => round.id !== roundId),
    updatedAt: Date.now(),
  };
}


/** Fix a name that was typed wrong, without disturbing the scores. */
function renamePlayer(game, playerId, name) {
  const cleaned = String(name || '').trim();
  if (!cleaned) return game;
  const players = game.players.map((player) =>
    player.id === playerId ? { ...player, name: cleaned } : player,
  );
  return { ...game, players, updatedAt: Date.now() };
}

/** Mark a game as one the shared database holds. */
function setShared(game, shared = true) {
  if (Boolean(game.shared) === Boolean(shared)) return game;
  return { ...game, shared: Boolean(shared), updatedAt: Date.now() };
}

function setFinished(game, finished) {
  return { ...game, finishedAt: finished ? Date.now() : null, updatedAt: Date.now() };
}

/**
 * Put an evening away, or bring it back. A finished game is still on the tab —
 * that is how a table checks last month's scores — until someone says it has
 * been looked at enough.
 */
function archiveGame(game, yes = true) {
  const at = yes ? Date.now() : null;
  if (at === (game.archivedAt || null)) return game;
  return { ...game, archivedAt: at, updatedAt: Date.now() };
}


/**
 * Merge two copies of the same game — the one here and the one the database
 * holds. The newer copy sets the names, the settings and the title, but the
 * rounds are unioned by id rather than replaced: two people scoring the same
 * evening on two phones would otherwise silently lose whichever round was
 * written second. A round deleted on one device and kept on the other comes
 * back, which is visible and undoable — unlike a round that vanishes.
 */
function mergeGames(a, b) {
  if (!isValidGame(a)) return b;
  if (!isValidGame(b)) return a;
  if (a.id !== b.id) return a;

  const [newer, older] = (a.updatedAt || 0) >= (b.updatedAt || 0) ? [a, b] : [b, a];
  const byId = new Map();
  for (const round of [...older.rounds, ...newer.rounds]) {
    if (round && typeof round.id === 'string') byId.set(round.id, round);
  }

  // Keep the newer copy's order, then anything only the older one knew about.
  const ordered = [
    ...newer.rounds.filter((round) => byId.has(round.id)).map((round) => byId.get(round.id)),
    ...older.rounds.filter((round) => !newer.rounds.some((other) => other.id === round.id)),
  ];

  if (ordered.length === newer.rounds.length) return newer;
  return { ...newer, rounds: ordered, updatedAt: Math.max(a.updatedAt || 0, b.updatedAt || 0) };
}

/** Start a fresh game with the same people and the same rules. */
function replayGame(game) {
  return createGame({
    presetId: game.presetId,
    names: game.players.map((player) => player.name),
    overrides: { ...game.config },
    name: game.name,
    shared: Boolean(game.shared),
    groupId: game.groupId,
  });
}

/** Whoever deals this round — the deal goes round the table. */
function dealerFor(game, roundNumber) {
  if (!game.players.length) return null;
  return game.players[roundNumber % game.players.length];
}

/** The people most recently played with, for the new-game form to offer. */
function recentNames(games, limit = 12) {
  const seen = [];
  for (const game of [...games].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))) {
    for (const player of game.players) {
      if (!seen.includes(player.name)) seen.push(player.name);
      if (seen.length >= limit) return seen;
    }
  }
  return seen;
}

/** Defensive read of anything coming back from storage or an import file. */
function isValidGame(value) {
  return Boolean(
    value &&
      typeof value === 'object' &&
      typeof value.id === 'string' &&
      Array.isArray(value.players) &&
      value.players.every((p) => p && typeof p.id === 'string' && typeof p.name === 'string') &&
      Array.isArray(value.rounds) &&
      value.config &&
      typeof value.config === 'object',
  );
}

  // ---- src/scoring.js --------------------------------------------------
/**
 * Scoring engine. Pure functions over a game object — no DOM, no storage.
 *
 * A game looks like this:
 * {
 *   id, presetId, name, createdAt, updatedAt, finishedAt: null | number,
 *   players: [{ id, name }],
 *   config: { direction, endMode, target, rounds, roundSum, allowNegative, entrantLabel },
 *   rounds: [{ id, scores: { [playerId]: number }, meta: string|null, note: string }]
 * }
 */

/** Score a single player recorded for one round (missing entries count as 0). */
function roundScore(round, playerId) {
  const value = round.scores?.[playerId];
  return Number.isFinite(value) ? value : 0;
}

/** Sum of every score recorded in a round. */
function roundSum(round) {
  return Object.values(round.scores || {}).reduce(
    (sum, value) => sum + (Number.isFinite(value) ? value : 0),
    0,
  );
}

/** Totals keyed by player id, over the first `upTo` rounds (all of them by default). */
function totals(game, upTo = Infinity) {
  const result = {};
  for (const player of game.players) result[player.id] = 0;
  game.rounds.slice(0, upTo).forEach((round) => {
    for (const player of game.players) {
      result[player.id] += roundScore(round, player.id);
    }
  });
  return result;
}

/**
 * Players ordered from best to worst, with ranks (ties share a rank).
 * Each entry: { id, name, total, rank, gap } where `gap` is the distance to the leader.
 */
function standings(game) {
  const totalsById = totals(game);
  const sign = game.config.direction === 'low' ? 1 : -1;
  const rows = game.players
    .map((player) => ({
      id: player.id,
      name: player.name,
      total: totalsById[player.id],
    }))
    .sort((a, b) => sign * (a.total - b.total));

  const best = rows.length ? rows[0].total : 0;
  let rank = 0;
  let previous = null;
  rows.forEach((row, index) => {
    if (previous === null || row.total !== previous) rank = index + 1;
    previous = row.total;
    row.rank = rank;
    row.gap = Math.abs(row.total - best);
  });
  return rows;
}

/**
 * Where the game stands.
 * { finished, reason, winners: [row], leaders: [row], standings, remaining }
 * `reason` is 'manual' (ended by hand), 'threshold', 'rounds' or null.
 * `remaining` is how much is left before the game ends, when that is knowable.
 */
function gameStatus(game) {
  const rows = standings(game);
  const { endMode, target, rounds } = game.config;
  const leaders = rows.filter((row) => rows.length && row.total === rows[0].total);

  let finished = false;
  let reason = null;
  let remaining = null;

  if (game.finishedAt) {
    finished = true;
    reason = 'manual';
  } else if (endMode === 'threshold' && Number.isFinite(target)) {
    // Either way it is the highest total that trips the target: in a penalty
    // game the player who gets there ends it and the lowest total still wins,
    // in a race the player who gets there wins.
    const highest = rows.length ? Math.max(...rows.map((r) => r.total)) : 0;
    finished = rows.length > 0 && highest >= target;
    if (finished) reason = 'threshold';
    remaining = Math.max(0, target - highest);
  } else if (endMode === 'rounds' && Number.isFinite(rounds)) {
    finished = game.rounds.length >= rounds;
    if (finished) reason = 'rounds';
    remaining = Math.max(0, rounds - game.rounds.length);
  }

  return {
    finished,
    reason,
    standings: rows,
    leaders,
    winners: finished ? leaders : [],
    remaining,
  };
}

/**
 * Check a round before it is recorded.
 * `scores` is { [playerId]: number | null } — null/undefined means "not filled in".
 * Returns { ok, errors: [{code, ...}], warnings: [{code, ...}] }.
 * Errors block saving; warnings are shown but can be accepted (house rules vary).
 */
function validateRound(game, scores) {
  const errors = [];
  const warnings = [];
  const missing = [];

  for (const player of game.players) {
    const value = scores?.[player.id];
    if (value === null || value === undefined || value === '') {
      missing.push(player.name);
      continue;
    }
    if (!Number.isFinite(value)) {
      errors.push({ code: 'notANumber', player: player.name });
      continue;
    }
    if (!Number.isInteger(value)) {
      errors.push({ code: 'notAnInteger', player: player.name });
      continue;
    }
    if (value < 0 && !game.config.allowNegative) {
      errors.push({ code: 'negative', player: player.name });
    }
  }

  if (missing.length) warnings.push({ code: 'missing', players: missing });

  const expected = game.config.roundSum;
  if (Number.isFinite(expected) && !missing.length) {
    const sum = Object.values(scores).reduce(
      (acc, value) => acc + (Number.isFinite(value) ? value : 0),
      0,
    );
    if (sum !== expected) warnings.push({ code: 'sum', sum, expected });
  }

  return { ok: errors.length === 0, errors, warnings };
}

/**
 * The value that completes a round to its expected sum, or null when the game
 * has no fixed round sum or more than one score is still missing.
 */
function completingScore(game, scores) {
  const expected = game.config.roundSum;
  if (!Number.isFinite(expected)) return null;
  const missing = game.players.filter((player) => {
    const value = scores?.[player.id];
    return value === null || value === undefined || value === '';
  });
  if (missing.length !== 1) return null;
  const sum = Object.values(scores).reduce(
    (acc, value) => acc + (Number.isFinite(value) ? value : 0),
    0,
  );
  const rest = expected - sum;
  if (rest < 0 && !game.config.allowNegative) return null;
  return { playerId: missing[0].id, value: rest };
}

/**
 * Card counters.
 *
 * Several games ask you to add up the cards in front of you at the end of a
 * round — exactly the sum a phone should be doing. A preset can therefore
 * carry a `helper` spec, and the round form offers a counter built from it:
 *
 *   mode     'count'  the same value can be tapped several times (Skyjo)
 *            'toggle' each value exists once and is picked or not (Papayoo)
 *   values   the tappable values, in the order they are shown
 *   labels   optional display text for a value, keyed by value
 *   toggles  extra switches, each adding a fixed amount (the queen of spades)
 *            or multiplying the total (Skyjo's doubling penalty)
 *
 * An entry is what someone has tapped: { cards: [value, …], toggles: {} }.
 * Nothing here touches the DOM, so the arithmetic can be tested on its own.
 */

function emptyHelperEntry() {
  return { cards: [], toggles: {} };
}

/** Tap a value: 'toggle' mode picks or unpicks it, 'count' mode adds one more. */
function tapCard(helper, entry, value) {
  if (helper.mode === 'toggle') {
    const cards = entry.cards.includes(value)
      ? entry.cards.filter((card) => card !== value)
      : [...entry.cards, value];
    return { ...entry, cards };
  }
  return { ...entry, cards: [...entry.cards, value] };
}

/** Undo the last tap — the way a mis-tap is actually corrected. */
function undoCard(entry) {
  return { ...entry, cards: entry.cards.slice(0, -1) };
}

function toggleSwitch(entry, key) {
  return { ...entry, toggles: { ...entry.toggles, [key]: !entry.toggles[key] } };
}

/** How many times a value has been tapped. */
function cardCount(entry, value) {
  return entry.cards.filter((card) => card === value).length;
}

/**
 * The score an entry adds up to: the cards, plus every switch that adds,
 * then multiplied by every switch that multiplies.
 */
function helperTotal(helper, entry) {
  let total = entry.cards.reduce((sum, value) => sum + value, 0);

  for (const item of helper.toggles || []) {
    if (entry.toggles?.[item.key] && Number.isFinite(item.add)) total += item.add;
  }
  for (const item of helper.toggles || []) {
    if (entry.toggles?.[item.key] && Number.isFinite(item.multiply)) total *= item.multiply;
  }
  return total;
}

/** True when nothing has been tapped at all — used to keep "Apply" honest. */
function isEmptyEntry(entry) {
  return entry.cards.length === 0 && !Object.values(entry.toggles || {}).some(Boolean);
}

/**
 * Whether a page is running inside an app's own browser — Messenger, Instagram,
 * Facebook, and their like — rather than in a real one.
 *
 * It matters here for one reason: those browsers keep their own files and their
 * own storage. A group joined inside Messenger's browser is joined *there*, and
 * Safari next door knows nothing about it — the person then believes they were
 * let in and finds nothing. Worse, they cannot add an app to the home screen
 * from there at all, so the only way forward is Safari anyway.
 *
 * This is user-agent sniffing, which is a heuristic and nothing more: it names
 * the common ones, and a browser it does not know is taken for a real one. The
 * cost of a wrong guess is one line of advice too many, which is why it only
 * ever advises.
 */
const IN_APP_BROWSERS = [
  // Order matters, and twice over. Messenger announces itself inside Facebook's
  // own marker — "FBAN/MessengerForiOS" — so it is looked for first, or everyone
  // reading in Messenger would be told about Facebook. And "MicroMessenger" is
  // WeChat, which contains the word Messenger.
  ['MessengerForiOS', 'Messenger'],
  ['MESSENGER', 'Messenger'],
  ['MicroMessenger', 'WeChat'],
  ['FBAN', 'Facebook'],
  ['FBAV', 'Facebook'],
  ['FB_IAB', 'Facebook'],
  ['Messenger', 'Messenger'],
  ['Instagram', 'Instagram'],
  ['LinkedInApp', 'LinkedIn'],
  ['Twitter', 'X'],
  ['Line/', 'LINE'],
  ['Snapchat', 'Snapchat'],
  ['TikTok', 'TikTok'],
  ['BytedanceWebview', 'TikTok'],
  ['Pinterest', 'Pinterest'],
  ['WhatsApp', 'WhatsApp'],
];

/** The name of the app whose browser this is, or null for a real browser. */
function inAppBrowser(userAgent) {
  const text = String(userAgent || '');
  if (!text) return null;
  for (const [needle, name] of IN_APP_BROWSERS) {
    if (text.includes(needle)) return name;
  }
  return null;
}

/**
 * French Tarot scoring.
 *
 * The one game here whose score is not counted but computed, from the
 * contract, the oudlers held and the points taken. The arithmetic is
 * mechanical, which is exactly why it belongs in the app rather than in
 * someone's head at eleven at night.
 *
 * The formula, as the French federation states it:
 *
 *     (25 + |écart| + petit au bout) × multiplicateur  + poignée + chelem
 *
 * where the écart is the taker's points minus what the contract required, the
 * petit au bout is worth 10 to whichever side won the last trick with it, and
 * the poignée and chelem bonuses are added afterwards, unmultiplied, to the
 * side that won the deal.
 *
 * The result is zero-sum: what the taker's side gains, the defence loses.
 *
 * Every step is returned in `breakdown` so the players can check the sum at
 * the table — a calculator that cannot be checked is worse than none.
 */

/** What the taker must make, by number of oudlers held (Petit, 21, Excuse). */
const THRESHOLDS = { 0: 56, 1: 51, 2: 41, 3: 36 };

/** The deck holds 91 points in all. */
const TOTAL_POINTS = 91;

const CONTRACTS = [
  { id: 'petite', multiplier: 1 },
  { id: 'garde', multiplier: 2 },
  { id: 'gardeSans', multiplier: 4 },
  { id: 'gardeContre', multiplier: 6 },
];

/** Handfuls of trumps, shown and rewarded to whoever wins the deal. */
const POIGNEES = [
  { id: 'none', value: 0 },
  { id: 'simple', value: 20 },
  { id: 'double', value: 30 },
  { id: 'triple', value: 40 },
];

const CHELEMS = [
  { id: 'none', value: 0 },
  { id: 'announcedMade', value: 400 },
  { id: 'announcedFailed', value: -200 },
  { id: 'unannouncedMade', value: 200 },
];

function contractMultiplier(id) {
  return CONTRACTS.find((contract) => contract.id === id)?.multiplier ?? 1;
}

function valueOf(list, id) {
  return list.find((item) => item.id === id)?.value ?? 0;
}

/**
 * Score one deal.
 *
 * deal = {
 *   takerId, partnerId (5 players, null when the taker called themselves),
 *   contract: 'petite' | 'garde' | 'gardeSans' | 'gardeContre',
 *   oudlers: 0 | 1 | 2 | 3,
 *   points: what the taker took, 0 to 91,
 *   petitAuBout: 'none' | 'taker' | 'defence',
 *   poignee: 'none' | 'simple' | 'double' | 'triple',
 *   chelem: 'none' | 'announcedMade' | 'announcedFailed' | 'unannouncedMade',
 * }
 *
 * Returns { threshold, gap, won, amount, scores, breakdown }, where `scores`
 * is keyed by player id and always adds up to zero.
 */
function scoreDeal(players, deal) {
  const threshold = THRESHOLDS[deal.oudlers] ?? THRESHOLDS[0];
  const gap = deal.points - threshold;
  const won = gap >= 0;
  const multiplier = contractMultiplier(deal.contract);

  // The petit au bout is worth 10 to the side that took it; seen from the
  // taker, that reduces a loss just as it increases a win.
  const petit = deal.petitAuBout === 'taker' ? 10 : deal.petitAuBout === 'defence' ? -10 : 0;
  const inner = 25 + Math.abs(gap) + (won ? petit : -petit);

  const poignee = valueOf(POIGNEES, deal.poignee);
  const chelem = valueOf(CHELEMS, deal.chelem);

  // Bonuses land outside the multiplication, on the winning side.
  const amount = (won ? 1 : -1) * inner * multiplier + (won ? poignee : -poignee) + chelem;

  const scores = {};
  const partnered = deal.partnerId && deal.partnerId !== deal.takerId;
  for (const player of players) {
    if (player.id === deal.takerId) {
      scores[player.id] = partnered ? 2 * amount : (players.length - 1) * amount;
    } else if (partnered && player.id === deal.partnerId) {
      scores[player.id] = amount;
    } else {
      scores[player.id] = -amount;
    }
  }

  return {
    threshold,
    gap,
    won,
    multiplier,
    amount,
    scores,
    breakdown: {
      threshold,
      points: deal.points,
      gap,
      base: 25,
      petit,
      inner,
      multiplier,
      poignee: won ? poignee : -poignee,
      chelem,
      amount,
    },
  };
}

/** True when the deal can be scored — every field present and sane. */
function isCompleteDeal(players, deal) {
  if (!deal?.takerId || !players.some((player) => player.id === deal.takerId)) return false;
  if (!CONTRACTS.some((contract) => contract.id === deal.contract)) return false;
  if (![0, 1, 2, 3].includes(deal.oudlers)) return false;
  return Number.isFinite(deal.points) && deal.points >= 0 && deal.points <= TOTAL_POINTS;
}

/**
 * A QR code, computed here rather than fetched from a service — the app has
 * no dependencies and must work with no network.
 *
 * Only what a link needs is implemented: byte mode, error correction level M,
 * and whichever version (size) fits. That covers URLs up to a few hundred
 * characters, which is every link this app hands out.
 *
 * Returns a square matrix of booleans; drawing it is the caller's business.
 */

/* --- Galois field arithmetic, for the error-correction codewords ---------- */

const EXP = new Uint8Array(512);
const LOG = new Uint8Array(256);
(() => {
  let x = 1;
  for (let i = 0; i < 255; i += 1) {
    EXP[i] = x;
    LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11d;
  }
  for (let i = 255; i < 512; i += 1) EXP[i] = EXP[i - 255];
})();

const mul = (a, b) => (a === 0 || b === 0 ? 0 : EXP[LOG[a] + LOG[b]]);

function generatorPoly(degree) {
  let poly = [1];
  for (let i = 0; i < degree; i += 1) {
    const next = new Array(poly.length + 1).fill(0);
    for (let j = 0; j < poly.length; j += 1) {
      next[j] ^= poly[j];
      next[j + 1] ^= mul(poly[j], EXP[i]);
    }
    poly = next;
  }
  return poly;
}

function errorCorrection(data, count) {
  const poly = generatorPoly(count);
  const result = new Array(count).fill(0);
  for (const byte of data) {
    const factor = byte ^ result[0];
    result.shift();
    result.push(0);
    for (let i = 0; i < count; i += 1) result[i] ^= mul(poly[i + 1], factor);
  }
  return result;
}

/* --- Per-version parameters, error correction level M --------------------- */

/**
 * [ total codewords, ec codewords per block, blocks in group 1, blocks in group 2 ]
 *
 * Stops at version 6, which holds 106 bytes — more than any link this app
 * hands out. Every one of these was checked module for module against a
 * reference encoder, for all eight masks; the block tables beyond version 6
 * were not, so they are not here. Longer text returns null and the caller
 * shows the plain link.
 */
const VERSIONS = {
  1: [26, 10, 1, 0], 2: [44, 16, 1, 0], 3: [70, 26, 1, 0],
  4: [100, 18, 2, 0], 5: [134, 24, 2, 0], 6: [172, 16, 4, 0],
};

const ALIGNMENT = {
  1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30], 6: [6, 34],
};

/** Data codewords available, total minus error correction. */
function dataCapacity(version) {
  const [total, ecPerBlock, group1, group2] = VERSIONS[version];
  return total - ecPerBlock * (group1 + group2);
}

function chooseVersion(byteLength) {
  for (const version of Object.keys(VERSIONS).map(Number)) {
    // 4 bits of mode, 8 of length (versions 1 to 9), then the data itself.
    if (dataCapacity(version) * 8 >= 4 + 8 + byteLength * 8) return version;
  }
  return null;
}

/** The longest text this encoder will take, in bytes. */
const MAX_BYTES = (() => {
  let max = 0;
  for (const version of Object.keys(VERSIONS).map(Number)) {
    max = Math.max(max, Math.floor((dataCapacity(version) * 8 - 12) / 8));
  }
  return max;
})();

/* --- Bit assembly --------------------------------------------------------- */

function encodeData(bytes, version) {
  const bits = [];
  const push = (value, length) => {
    for (let i = length - 1; i >= 0; i -= 1) bits.push((value >> i) & 1);
  };

  push(0b0100, 4); // byte mode
  push(bytes.length, 8);
  for (const byte of bytes) push(byte, 8);

  const capacity = dataCapacity(version) * 8;
  push(0, Math.min(4, capacity - bits.length)); // terminator
  while (bits.length % 8) bits.push(0);

  const codewords = [];
  for (let i = 0; i < bits.length; i += 8) {
    codewords.push(bits.slice(i, i + 8).reduce((value, bit) => (value << 1) | bit, 0));
  }
  const padding = [0xec, 0x11];
  let index = 0;
  while (codewords.length < dataCapacity(version)) {
    codewords.push(padding[index++ % 2]);
  }
  return codewords;
}

/** Split into blocks, add error correction, then interleave as the spec says. */
function finalCodewords(dataCodewords, version) {
  const [, ecPerBlock, group1, group2] = VERSIONS[version];
  const blocks = group1 + group2;
  const shortLength = Math.floor(dataCodewords.length / blocks);

  const dataBlocks = [];
  const ecBlocks = [];
  let at = 0;
  for (let i = 0; i < blocks; i += 1) {
    const length = i < group1 ? shortLength : shortLength + 1;
    const block = dataCodewords.slice(at, at + length);
    at += length;
    dataBlocks.push(block);
    ecBlocks.push(errorCorrection(block, ecPerBlock));
  }

  const out = [];
  const longest = Math.max(...dataBlocks.map((block) => block.length));
  for (let i = 0; i < longest; i += 1) {
    for (const block of dataBlocks) if (i < block.length) out.push(block[i]);
  }
  for (let i = 0; i < ecPerBlock; i += 1) {
    for (const block of ecBlocks) out.push(block[i]);
  }
  return out;
}

/* --- The matrix ----------------------------------------------------------- */

function emptyMatrix(size) {
  return {
    modules: Array.from({ length: size }, () => new Array(size).fill(null)),
    reserved: Array.from({ length: size }, () => new Array(size).fill(false)),
    size,
  };
}

function placeFinder(matrix, row, col) {
  for (let r = -1; r <= 7; r += 1) {
    for (let c = -1; c <= 7; c += 1) {
      const y = row + r;
      const x = col + c;
      if (y < 0 || y >= matrix.size || x < 0 || x >= matrix.size) continue;
      const inRing = (r >= 0 && r <= 6 && (c === 0 || c === 6)) || (c >= 0 && c <= 6 && (r === 0 || r === 6));
      const inCore = r >= 2 && r <= 4 && c >= 2 && c <= 4;
      matrix.modules[y][x] = inRing || inCore;
      matrix.reserved[y][x] = true;
    }
  }
}

function placePatterns(matrix, version) {
  const size = matrix.size;
  placeFinder(matrix, 0, 0);
  placeFinder(matrix, 0, size - 7);
  placeFinder(matrix, size - 7, 0);

  for (let i = 8; i < size - 8; i += 1) {
    const dark = i % 2 === 0;
    matrix.modules[6][i] = dark;
    matrix.reserved[6][i] = true;
    matrix.modules[i][6] = dark;
    matrix.reserved[i][6] = true;
  }

  for (const row of ALIGNMENT[version]) {
    for (const col of ALIGNMENT[version]) {
      if (matrix.reserved[row][col]) continue;
      for (let r = -2; r <= 2; r += 1) {
        for (let c = -2; c <= 2; c += 1) {
          matrix.modules[row + r][col + c] = Math.max(Math.abs(r), Math.abs(c)) !== 1;
          matrix.reserved[row + r][col + c] = true;
        }
      }
    }
  }

  // The dark module, and the space the format information will occupy.
  matrix.modules[size - 8][8] = true;
  matrix.reserved[size - 8][8] = true;
  for (let i = 0; i < 9; i += 1) {
    if (!matrix.reserved[8][i]) { matrix.modules[8][i] = false; matrix.reserved[8][i] = true; }
    if (!matrix.reserved[i][8]) { matrix.modules[i][8] = false; matrix.reserved[i][8] = true; }
  }
  for (let i = size - 8; i < size; i += 1) {
    if (!matrix.reserved[8][i]) { matrix.modules[8][i] = false; matrix.reserved[8][i] = true; }
    if (!matrix.reserved[i][8]) { matrix.modules[i][8] = false; matrix.reserved[i][8] = true; }
  }
}

function placeData(matrix, codewords) {
  const size = matrix.size;
  const bits = [];
  for (const codeword of codewords) {
    for (let i = 7; i >= 0; i -= 1) bits.push((codeword >> i) & 1);
  }

  let bit = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right -= 1; // the vertical timing pattern is skipped
    // Which way this pair of columns runs follows from its position, not from
    // a flag: the skipped column would put a toggle out of step.
    const upward = ((right + 1) & 2) === 0;
    for (let step = 0; step < size; step += 1) {
      const row = upward ? size - 1 - step : step;
      for (const col of [right, right - 1]) {
        if (matrix.reserved[row][col]) continue;
        matrix.modules[row][col] = bit < bits.length ? bits[bit] === 1 : false;
        bit += 1;
      }
    }
  }
}

const MASKS = [
  (r, c) => (r + c) % 2 === 0,
  (r) => r % 2 === 0,
  (r, c) => c % 3 === 0,
  (r, c) => (r + c) % 3 === 0,
  (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
  (r, c) => ((r * c) % 2) + ((r * c) % 3) === 0,
  (r, c) => (((r * c) % 2) + ((r * c) % 3)) % 2 === 0,
  (r, c) => (((r + c) % 2) + ((r * c) % 3)) % 2 === 0,
];

/** Format information: error correction level M with the chosen mask. */
function placeFormat(matrix, mask) {
  const data = (0b00 << 3) | mask; // 00 = level M
  let bits = data << 10;
  for (let i = 4; i >= 0; i -= 1) {
    if (bits & (1 << (i + 10))) bits ^= 0b10100110111 << i;
  }
  const format = ((data << 10) | bits) ^ 0b101010000010010;

  const size = matrix.size;
  // The specification names these positions as (x, y); everything here is
  // addressed [row][col], so each one is written the other way round.
  for (let i = 0; i < 15; i += 1) {
    const dark = ((format >> i) & 1) === 1;

    // First copy, wrapped around the top-left finder
    if (i < 6) matrix.modules[i][8] = dark;
    else if (i === 6) matrix.modules[7][8] = dark;
    else if (i === 7) matrix.modules[8][8] = dark;
    else if (i === 8) matrix.modules[8][7] = dark;
    else matrix.modules[8][14 - i] = dark;

    // Second copy, split between the other two finders
    if (i < 8) matrix.modules[8][size - 1 - i] = dark;
    else matrix.modules[size - 15 + i][8] = dark;
  }
}

function penalty(modules) {
  const size = modules.length;
  let score = 0;

  const run = (get) => {
    for (let a = 0; a < size; a += 1) {
      let last = null;
      let length = 0;
      for (let b = 0; b < size; b += 1) {
        const value = get(a, b);
        if (value === last) length += 1;
        else { last = value; length = 1; }
        if (length === 5) score += 3;
        else if (length > 5) score += 1;
      }
    }
  };
  run((r, c) => modules[r][c]);
  run((c, r) => modules[r][c]);

  for (let r = 0; r < size - 1; r += 1) {
    for (let c = 0; c < size - 1; c += 1) {
      const v = modules[r][c];
      if (v === modules[r][c + 1] && v === modules[r + 1][c] && v === modules[r + 1][c + 1]) score += 3;
    }
  }

  let dark = 0;
  for (const row of modules) for (const value of row) if (value) dark += 1;
  const ratio = (dark * 100) / (size * size);
  score += Math.floor(Math.abs(ratio - 50) / 5) * 10;
  return score;
}

/**
 * The matrix for `text`, or null when it is too long for what is implemented.
 * `mask` forces one of the eight patterns instead of picking the best; it
 * exists so the result can be compared against a reference encoder.
 */
function qrMatrix(text, { mask: forced = null } = {}) {
  const bytes = Array.from(new TextEncoder().encode(text));
  const version = chooseVersion(bytes.length);
  if (!version) return null;

  const codewords = finalCodewords(encodeData(bytes, version), version);
  const size = 17 + version * 4;

  let best = null;
  const masks = forced === null ? [0, 1, 2, 3, 4, 5, 6, 7] : [forced];
  for (const mask of masks) {
    const matrix = emptyMatrix(size);
    placePatterns(matrix, version);
    placeData(matrix, codewords);
    for (let r = 0; r < size; r += 1) {
      for (let c = 0; c < size; c += 1) {
        if (!matrix.reserved[r][c] && MASKS[mask](r, c)) matrix.modules[r][c] = !matrix.modules[r][c];
      }
    }
    placeFormat(matrix, mask);
    const score = penalty(matrix.modules);
    if (!best || score < best.score) best = { score, modules: matrix.modules };
  }
  return best.modules;
}

/** The matrix as an SVG, with the quiet zone every reader expects. */
function qrSvg(text, { size = 220, quiet = 4 } = {}) {
  const modules = qrMatrix(text);
  if (!modules) return null;
  const count = modules.length + quiet * 2;
  const rects = [];
  modules.forEach((row, r) => {
    row.forEach((dark, c) => {
      if (dark) rects.push(`<rect x="${c + quiet}" y="${r + quiet}" width="1" height="1"/>`);
    });
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${count} ${count}" width="${size}" height="${size}" role="img"><rect width="${count}" height="${count}" fill="#fff"/><g fill="#000">${rects.join('')}</g></svg>`;
}

/**
 * Clocks and tombstones, for the documents several people edit at once.
 *
 * Lists and polls are merged the same way and for the same reason — two phones
 * touching the same thing within a second of each other — so the two rules
 * that make those merges work live here, once.
 */

/**
 * The next stamp for something that has just changed: now, or one more than it
 * carried, whichever is later. Never returning the same value twice is what
 * lets a merge tell "someone changed this" from "nobody touched it", even when
 * both happen inside the same millisecond.
 */
function later(previous) {
  return Math.max(Date.now(), (previous || 0) + 1);
}

/** A changed document, stamped. */
function touch(document_, patch) {
  return { ...document_, ...patch, updatedAt: later(document_.updatedAt) };
}

/**
 * How long a deletion is remembered. A line deleted here has to stay deleted
 * when the other phone — which still holds it — syncs again; a month is longer
 * than any phone stays away, and short enough that the traces never pile up.
 */
const FORGET_AFTER = 30 * 24 * 60 * 60 * 1000;

function prune(removed, now = Date.now()) {
  const kept = {};
  for (const [id, at] of Object.entries(removed || {})) {
    if (now - at < FORGET_AFTER) kept[id] = at;
  }
  return kept;
}

/**
 * The people a shared document concerns — a list's, a poll's.
 *
 * They behave the same everywhere: added by name, renamed without losing what
 * hangs off them, and removed together with whatever the document held about
 * them. What differs is only that last part, so each document says how to
 * forget someone and the rest is written once, here.
 *
 * They also carry their own clock, `peopleAt`. A merge needs it: without it,
 * "Alice was just removed" and "this copy has never heard of Alice" look
 * exactly alike, and removing someone gets undone by the next sync.
 */



function addPerson(document_, name) {
  const clean = String(name || '').trim();
  if (!clean) return document_;
  return touch(document_, {
    people: [...document_.people, { id: uid('w'), name: clean }],
    peopleAt: later(document_.peopleAt),
  });
}

function renamePerson(document_, personId, name) {
  const clean = String(name || '').trim();
  if (!clean) return document_;
  return touch(document_, {
    people: document_.people.map((person) =>
      (person.id === personId ? { ...person, name: clean } : person)),
    peopleAt: later(document_.peopleAt),
  });
}

/**
 * Remove someone. `forget` returns whatever else the document must change —
 * the lines that were theirs, the answers they gave — as a patch.
 */
function removePerson(document_, personId, forget = () => ({})) {
  return touch(document_, {
    people: document_.people.filter((person) => person.id !== personId),
    peopleAt: later(document_.peopleAt),
    ...forget(document_, personId),
  });
}

/** The names already used, most recent first, to offer when starting another. */
function recentPeople(documents, limit = 12) {
  const seen = [];
  for (const document_ of [...documents].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))) {
    for (const person of document_.people || []) {
      if (!seen.includes(person.name)) seen.push(person.name);
      if (seen.length >= limit) return seen;
    }
  }
  return seen;
}

/**
 * Me first, in a form nothing has been typed into yet — because whoever fills
 * in a list is nearly always on it.
 *
 * Only ever called on a form that has just been emptied, never on every
 * redraw: a name put back after someone deleted it would put them on a list
 * they had just taken themselves off.
 */
function withMeFirst(names, me) {
  const clean = String(me || '').trim();
  if (!clean) return names;
  if (names.some((name) => String(name || '').trim().toLowerCase() === clean.toLowerCase())) return names;
  if (names.some((name) => String(name || '').trim())) return names;
  return [clean, ...names.slice(1)];
}

/** The other way round: take my name back out of a form nobody has typed in. */
function withoutMe(names, me) {
  const clean = String(me || '').trim().toLowerCase();
  if (!clean) return names;
  const index = names.findIndex((name) => String(name || '').trim().toLowerCase() === clean);
  if (index < 0) return names;
  const kept = [...names];
  kept[index] = '';
  return kept;
}
